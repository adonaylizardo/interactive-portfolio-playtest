name: Verify

on:
  pull_request:
    branches:
      - 'cursor/**'
  push:
    branches:
      - 'cursor/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm run typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: npm run qa:pinch
        timeout-minutes: 22
        run: npm run qa:pinch

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots-${{ github.run_id }}
          path: |
            artifacts/qa-screenshots/desktop-1280x800.png
            artifacts/qa-screenshots/mobile-375x812.png
            artifacts/qa-screenshots/qa-pinch-results.json
          if-no-files-found: error
