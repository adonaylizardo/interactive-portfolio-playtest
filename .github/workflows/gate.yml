name: Gate

# Fast checks that must pass before anything is deployed: build, typecheck, sprite
# placement / picking / interiors, and the real-input smoke (first load framing, door
# entry, single-tap exits, input, camera follow, logos, NPCs, player, case panel, map
# fill) on Chromium and WebKit. Each suite runs as parallel shards so every job stays
# well inside its timeout (~12 min wall clock); `gate passed` is the single check to require.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  sprites:
    name: qa:sprites (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: map + pixel diff + shots
            parts: placement,picks,map,diff,shots
          - name: interiors
            parts: interiors
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm run typecheck
        run: npm run typecheck

      - name: check:logos
        run: node scripts/check-logos.mjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: qa:sprites
        timeout-minutes: 15
        env:
          QA_SPRITES_ONLY: ${{ matrix.parts }}
        run: node scripts/qa-sprites.mjs --shots

      - name: Upload sprite shots
        if: always() && contains(matrix.parts, 'shots')
        uses: actions/upload-artifact@v4
        with:
          name: gate-sprites-${{ github.run_id }}
          path: artifacts/run39/*.png
          if-no-files-found: warn

  smoke:
    name: qa:smoke (${{ matrix.groups }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        groups:
          - exits-iphone
          - exits-desktop,exits-phone,about
          - firstload,input,case,fill
          - follow,logos,npcs,player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: Install Playwright Chromium + WebKit
        run: npx playwright install chromium webkit --with-deps

      - name: qa:smoke
        timeout-minutes: 24
        env:
          QA_SMOKE_ONLY: ${{ matrix.groups }}
        run: node scripts/qa-smoke.mjs

  result:
    name: gate passed
    needs: [sprites, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: |
          echo "sprites: ${{ needs.sprites.result }}, smoke: ${{ needs.smoke.result }}"
          test "${{ needs.sprites.result }}" = success && test "${{ needs.smoke.result }}" = success
